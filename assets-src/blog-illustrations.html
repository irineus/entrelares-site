<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Entrelares — blog illustrations (L-42)</title>
<!--
  L-42 — generator for the three 1600x900 masters of the holiday articles:

    #natal     public/blog/img/natal-ano-novo.jpg
    #ferias    public/blog/img/ferias-escolares.jpg
    #combinar  public/blog/img/combinar-festas.jpg

  The first four masters (calendario-familia, coparentalidade, crianca-pais,
  planejamento-semana) are photographs the owner added in July 2026. These three
  are DRAWN instead: nothing downloaded, no stock photo, no faces. Flat shapes in
  the article palette (indigo 4f46e5 and pink db2777 for the two homes, the same
  pair the articles' SVG figures use; amber d97706 as the accent the OG banner
  uses; surface f8fafc, line e2e8f0, ink 1e293b).

  No year, weekday or school date is drawn: a weekday under a day number is a
  claim about one specific year, and school terms change per network.

  NOT served: this file lives in assets-src/, like the OG banner generators.

  Render each scene with headless Chrome (the window is taller than the canvas
  because some headless builds subtract window chrome from the height), crop the
  top-left 1600x900 and save the JPEG master; then run blog-images.py for the
  responsive set:

    chrome headless=new, disable-gpu, hide-scrollbars, force-device-scale-factor=1,
           window-size=1600,1000, screenshot=shot.png,
           file:///.../assets-src/blog-illustrations.html#natal
    python: Image.open(shot).crop((0,0,1600,900)).convert('RGB')
            .save('public/blog/img/natal-ano-novo.jpg', quality=86,
                  optimize=True, progressive=True)
    python assets-src/blog-images.py

  (Flags written without their leading dashes so this comment stays free of
  double hyphens, the habit the sitemap taught; each one is a normal Chrome
  switch.) The 16:9 canvas makes blog-images.py's centre crop a no-op.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; background: #f8fafc; }
  svg { display: none; width: 1600px; height: 900px; }
  svg text { font-family: "Segoe UI", "Liberation Sans", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
</style>
</head>

<svg id="defs" width="0" height="0" style="display:block;position:absolute">

    <radialGradient id="glowIndigo" cx="0.92" cy="0" r="0.65">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.14" />
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber" cx="0.04" cy="1" r="0.6">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.13" />
      <stop offset="1" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e293b" flood-opacity="0.10" />
    </filter>
    <g id="house">
      <path d="M0 40 L50 0 L100 40 L100 100 L0 100 Z" />
    </g>
  </defs>
</svg>
