<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Entrelares — brand icon generator</title>
<!--
  F-54 — generator for the Entrelares brand icon (all PNG sizes/variants).

  THE MARK: two houses — one indigo (#4f46e5), one rose (#db2777) — overlap, and their
  geometric intersection forms a THIRD little house (deep violet) with a white heart
  inside: "Duas casas, uma mesma infância." The overlap shape is the exact intersection
  of the two house polygons, which is why it reads as a house on its own.

  NOT served: this file lives in assets-src/, like the OG-cover generators. The same
  mark is duplicated inline in og-cover.html / og-cover-en.html here, and in the app
  repo's store/icon-entrelares.html + store/feature-graphic.html — keep the <g id="mark">
  block identical in all of them when the mark changes.

  Variant is picked with a URL FRAGMENT (file:// query strings don't survive headless
  Chrome): #<size>[-maskable|-tight]
    (none)    → full-bleed icon, comfortable margin (icon-192.png, icon-512.png)
    -maskable → mark shrunk to the 80% safe zone (the app repo's maskable icons)
    -tight    → bigger mark, minimal margin (favicon.png, 96px)

  Render with headless Chrome. NOTE: some headless builds subtract window chrome from
  --window-size (the viewport comes out ~87px SHORTER than asked), so render with a
  LARGER window and crop the top-left corner to the exact size:

    chrome --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
           --screenshot=/tmp/shot.png --window-size=612,662 \
           "assets-src/icon-entrelares.html#512"
    python3 -c "from PIL import Image; Image.open('/tmp/shot.png').crop((0,0,512,512))\
    .convert('RGB').save('public/icon-512.png', optimize=True)"

  Outputs (this repo):           #96-tight → public/favicon.png
                                 #192      → public/icon-192.png
                                 #512      → public/icon-512.png
  Outputs (app repo, from its own copy of this file): wwwroot favicon/icon-192/icon-512,
  icon-maskable-192/512 (#…-maskable) and store/store_icon.png (= maskable 512).
-->
<style>
  * { margin: 0; padding: 0; }
  html, body { background: #ffffff; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="icon" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g id="mark" stroke-linejoin="round" transform="translate(0,6)">
    <!-- casa 1 (índigo) -->
    <path d="M108 210 L208 130 L308 210 L308 390 L108 390 Z" fill="#4f46e5" stroke="#4f46e5" stroke-width="22"/>
    <!-- casa 2 (rosa) -->
    <path d="M204 210 L304 130 L404 210 L404 390 L204 390 Z" fill="#db2777" stroke="#db2777" stroke-width="22"/>
    <!-- a casinha compartilhada: interseção geométrica exata das duas casas -->
    <path d="M204 210 L256 168.4 L308 210 L308 390 L204 390 Z" fill="#5b21b6" stroke="#5b21b6" stroke-width="22"/>
    <!-- coração -->
    <g transform="translate(256,262) scale(1.45)">
      <path d="M0 18 C 0 10 -6 2 -16 2 C -27 2 -32 10 -32 17 C -32 30 -14 40 0 52 C 14 40 32 30 32 17 C 32 10 27 2 16 2 C 6 2 0 10 0 18 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
<script>
  const [size, variant] = (location.hash.replace('#', '') || '512').split('-');
  const svg = document.getElementById('icon');
  svg.setAttribute('width', size); svg.setAttribute('height', size);
  const g = document.getElementById('mark');
  if (variant === 'maskable') g.setAttribute('transform', 'translate(0,6) translate(256,260) scale(0.80) translate(-256,-260)');
  if (variant === 'tight')    g.setAttribute('transform', 'translate(0,6) translate(256,260) scale(1.18) translate(-256,-260)');
</script>
</body>
</html>
