<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Entrelares — Open Graph cover (PT-BR)</title>
<!--
  F-54 — generator for public/og-cover.png (the PT-BR social-sharing banner).

  New visual identity (F-54): light theme, the two-houses mark and the brand tagline
  as the headline. Replaces the old dark-navy banner that still said "Guarda
  Compartilhada" (which, until this file, had no generator in the repo). The
  <g id="mark"> block is duplicated from icon-entrelares.html — keep them identical
  when the mark changes. The brand-row icon is the RENDERED public/icon-192.png, so
  it always matches the shipped icon. The English sibling is og-cover-en.html.

  NOT served: this file lives in assets-src/, like the lead-magnet PDF generator.

  Render with headless Chrome/Edge at the Open Graph size (1200x630):

    chrome --headless --disable-gpu --hide-scrollbars \
           --screenshot=public/og-cover.png --window-size=1200,630 \
           assets-src/og-cover.html

  NOTE: some headless builds subtract window chrome from --window-size (the viewport
  comes out ~87px shorter than asked). If the output shows a white band, render with
  a LARGER window and crop the top-left corner:

    chrome --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
           --screenshot=/tmp/shot.png --window-size=1300,780 assets-src/og-cover.html
    python3 -c "from PIL import Image; Image.open('/tmp/shot.png').crop((0,0,1200,630))\
    .convert('RGB').save('public/og-cover.png', optimize=True)"

  Re-render whenever the hero copy or the mark changes.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Liberation Sans", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: #f8fafc;
    background-image:
      radial-gradient(900px 560px at 88% 0%, #e0e7ff 0%, rgba(224,231,255,0) 60%),
      radial-gradient(760px 520px at 6% 100%, #fce7f3 0%, rgba(252,231,243,0) 58%),
      linear-gradient(160deg, #f8fafc 0%, #f1f5f9 100%);
    color: #0f172a;
    padding: 48px 70px 54px;
    position: relative;
  }
  /* Fixed positions, not flex space-between: font metrics differ per platform
     (Segoe UI on Windows, DejaVu on Linux CI) and a metric-dependent layout
     overflowed the 630px canvas when rendered off-Windows. */
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand img { width: 62px; height: 62px; border-radius: 16px; display: block; }
  .brand span { font-size: 31px; font-weight: 700; letter-spacing: -0.01em; }

  .mid { position: absolute; top: 185px; left: 70px; right: 460px; }
  h1 {
    font-size: 66px; font-weight: 800; line-height: 1.08; letter-spacing: -0.03em;
    margin-bottom: 22px;
  }
  h1 .casas { color: #4f46e5; }
  h1 .infancia { color: #db2777; }
  .sub { font-size: 27px; line-height: 1.42; color: #475569; }
  .sub b { color: #3730a3; font-weight: 700; }

  .art { position: absolute; top: 168px; right: 62px; }
  .art svg { width: 330px; height: 272px; display: block; }

  .foot { position: absolute; bottom: 54px; left: 70px; right: 70px;
          display: flex; align-items: center; gap: 16px; }
  .chip {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 999px;
    padding: 11px 22px;
    font-size: 21px;
    font-weight: 600;
    color: #334155;
  }
  .domain { margin-left: auto; font-size: 25px; font-weight: 700; color: #4f46e5; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- keep identical to assets-src/icon-entrelares.html -->
    <g id="mark" stroke-linejoin="round">
      <path d="M108 210 L208 130 L308 210 L308 390 L108 390 Z" fill="#4f46e5" stroke="#4f46e5" stroke-width="22"/>
      <path d="M204 210 L304 130 L404 210 L404 390 L204 390 Z" fill="#db2777" stroke="#db2777" stroke-width="22"/>
      <path d="M204 210 L256 168.4 L308 210 L308 390 L204 390 Z" fill="#5b21b6" stroke="#5b21b6" stroke-width="22"/>
      <g transform="translate(256,262) scale(1.45)">
        <path d="M0 18 C 0 10 -6 2 -16 2 C -27 2 -32 10 -32 17 C -32 30 -14 40 0 52 C 14 40 32 30 32 17 C 32 10 27 2 16 2 C 6 2 0 10 0 18 Z" fill="#ffffff"/>
      </g>
    </g>
  </defs>
</svg>

<div class="brand">
  <img src="../public/icon-192.png" alt="" />
  <span>Entrelares</span>
</div>

<div class="mid">
  <h1><span class="casas">Duas casas,</span><br /><span class="infancia">uma mesma infância.</span></h1>
  <p class="sub"><b>De quem é o dia hoje?</b> Calendário de convivência, trocas de dia com aprovação dos dois e histórico completo.</p>
</div>

<div class="art">
  <svg viewBox="86 114 340 304"><use href="#mark"/></svg>
</div>

<div class="foot">
  <span class="chip">Android e iPhone</span>
  <span class="chip">Sem anúncios</span>
  <span class="chip">O essencial é grátis</span>
  <span class="domain">entrelares.app</span>
</div>

</body>
</html>
