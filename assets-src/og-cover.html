<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Entrelares — Open Graph cover (PT-BR)</title>
<!--
  F-54 — generator for public/og-cover.png (the PT-BR social-sharing banner).

  Identity: the U-29 mark (26/08/2026) — a calendar card whose day cells draw the
  two interlocked houses, on the brand indigo #4F46E5. The plaque is
  assets-src/brand-marca.png shown 1:1, at the Android squircle radius; the
  brand-row icon is the RENDERED public/icon-192.png, so neither can drift from
  the mark the site serves. Run assets-src/brand-icons.py BEFORE re-rendering.
  Palette: the app's U-27 tokens — surface #F9FAFB, text #111827, muted #6B7280,
  outline #E5E7EB, accent #4F46E5, swapped amber #D97706. The cream/navy of the
  F-54 clay era went with the emblem it framed (T-57, 28/08/2026). The English sibling is
  og-cover-en.html.

  NOT served: this file lives in assets-src/, like the lead-magnet PDF generator.

  Render with headless Chrome/Edge at the Open Graph size (1200x630):

    chrome --headless --disable-gpu --hide-scrollbars \
           --screenshot=public/og-cover.png --window-size=1200,630 \
           assets-src/og-cover.html

  NOTE: some headless builds subtract window chrome from --window-size (the viewport
  comes out ~87px shorter than asked). If the output shows a white band, render with
  a LARGER window and crop the top-left corner:

    chrome --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
           --screenshot=/tmp/shot.png --window-size=1300,780 assets-src/og-cover.html
    python3 -c "from PIL import Image; Image.open('/tmp/shot.png').crop((0,0,1200,630))\
    .convert('RGB').save('public/og-cover.png', optimize=True)"

  Re-render whenever the hero copy or the artwork changes.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Liberation Sans", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: #f9fafb;
    background-image:
      radial-gradient(760px 480px at 92% 0%, rgba(79,70,229,0.12) 0%, rgba(79,70,229,0) 60%),
      radial-gradient(640px 440px at 4% 100%, rgba(217,119,6,0.12) 0%, rgba(217,119,6,0) 58%);
    color: #111827;
    padding: 48px 70px 54px;
    position: relative;
  }
  /* Fixed positions, not flex space-between: font metrics differ per platform
     (Segoe UI on Windows, DejaVu on Linux CI) and a metric-dependent layout
     overflowed the 630px canvas when rendered off-Windows. */
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand img { width: 62px; height: 62px; border-radius: 16px; display: block; }
  .brand span { font-size: 31px; font-weight: 700; letter-spacing: -0.01em; }

  .mid { position: absolute; top: 172px; left: 70px; right: 452px; }
  h1 {
    font-size: 61px; font-weight: 800; line-height: 1.12; letter-spacing: -0.025em;
    color: #111827; margin-bottom: 24px;
  }
  .sub { font-size: 27px; line-height: 1.42; color: #6b7280; }
  .sub b { color: #111827; font-weight: 700; }

  /* the brand plaque, framed: the square text-free master, shown 1:1 */
  .art {
    position: absolute; top: 148px; right: 66px;
    width: 316px; height: 316px;
    border-radius: 76px; overflow: hidden;   /* o squircle do Android */
    box-shadow: 0 12px 32px rgba(17, 24, 39, 0.16);
    background: url(brand-marca.png) no-repeat #4f46e5;
    background-size: 100% 100%;
  }

  .foot { position: absolute; bottom: 54px; left: 70px; right: 70px;
          display: flex; align-items: center; gap: 16px; }
  .chip {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 999px;
    padding: 11px 22px;
    font-size: 21px;
    font-weight: 600;
    color: #374151;
  }
  .domain { margin-left: auto; font-size: 25px; font-weight: 700; color: #4f46e5; }
</style>
</head>
<body>

<div class="brand">
  <img src="../public/icon-192.png" alt="" />
  <span>Entrelares</span>
</div>

<div class="mid">
  <h1>Duas casas,<br />uma mesma infância.</h1>
  <p class="sub"><b>De quem é o dia hoje?</b> Calendário de convivência, trocas de dia com aprovação dos dois e histórico completo.</p>
</div>

<div class="art"></div>

<div class="foot">
  <span class="chip">Android e iPhone</span>
  <span class="chip">Sem anúncios</span>
  <span class="chip">O essencial é grátis</span>
  <span class="domain">entrelares.app</span>
</div>

</body>
</html>
