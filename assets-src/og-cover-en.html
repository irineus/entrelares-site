<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Entrelares — English Open Graph cover</title>
<!--
  L-16/F-54 — generator for public/og-cover-en.png (the English social-sharing banner).

  Identity "O Emblema" (F-54): the official brand artwork (assets-src/brand-emblema.png,
  1024x1024 text-free, AI-generated, approved by the owner — no vector source) shown
  as a framed card on the cream layout, navy #2F4156 for text. The card's
  square framed card shows the TEXT-FREE square master 1:1 (the favicon derives
  from the flat variant brand-emblema-flat.png — see brand-icons.py). The brand-row icon is the RENDERED public/icon-192.png, so it always
  matches the shipped icon (see assets-src/brand-icons.py). The PT-BR banner
  (public/og-cover.png, og-cover.html) carries Portuguese text, so reusing it on
  /en/ would show a Portuguese preview to exactly the reader the English page
  exists for. (The artwork itself carries the PT tagline engraved — it is the brand
  plaque, kept identical in both banners on purpose.)

  NOT served: this file lives in assets-src/, like the lead-magnet PDF generator.

  Render with headless Chrome/Edge at the Open Graph size (1200x630):

    chrome --headless --disable-gpu --hide-scrollbars \
           --screenshot=public/og-cover-en.png --window-size=1200,630 \
           assets-src/og-cover-en.html

  NOTE: some headless builds subtract window chrome from --window-size (the viewport
  comes out ~87px shorter than asked). If the output shows a white band, render with
  a LARGER window and crop the top-left corner:

    chrome --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
           --screenshot=/tmp/shot.png --window-size=1300,780 assets-src/og-cover-en.html
    python3 -c "from PIL import Image; Image.open('/tmp/shot.png').crop((0,0,1200,630))\
    .convert('RGB').save('public/og-cover-en.png', optimize=True)"

  Re-render whenever the English hero copy or the artwork changes.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Liberation Sans", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: #f7f2e7;
    background-image:
      radial-gradient(760px 480px at 92% 0%, rgba(118,143,122,0.10) 0%, rgba(118,143,122,0) 60%),
      radial-gradient(640px 440px at 4% 100%, rgba(212,160,129,0.14) 0%, rgba(212,160,129,0) 58%);
    color: #2f4156;
    padding: 48px 70px 54px;
    position: relative;
  }
  /* Fixed positions, not flex space-between: font metrics differ per platform
     (Segoe UI on Windows, DejaVu on Linux CI) and a metric-dependent layout
     overflowed the 630px canvas when rendered off-Windows. */
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand img { width: 62px; height: 62px; border-radius: 16px; display: block; }
  .brand span { font-size: 31px; font-weight: 700; letter-spacing: -0.01em; }

  .mid { position: absolute; top: 172px; left: 70px; right: 452px; }
  h1 {
    font-size: 61px; font-weight: 800; line-height: 1.12; letter-spacing: -0.025em;
    color: #2f4156; margin-bottom: 24px;
  }
  .sub { font-size: 27px; line-height: 1.42; color: #56636e; }
  .sub b { color: #2f4156; font-weight: 700; }

  /* the brand plaque, framed: the square text-free master, shown 1:1 */
  .art {
    position: absolute; top: 148px; right: 66px;
    width: 316px; height: 316px;
    border-radius: 24px; overflow: hidden;
    box-shadow: 0 12px 32px rgba(93, 79, 54, 0.18);
    background: url(brand-emblema.png) no-repeat #f2f0ec;
    background-size: 100% 100%;
  }

  .foot { position: absolute; bottom: 54px; left: 70px; right: 70px;
          display: flex; align-items: center; gap: 16px; }
  .chip {
    background: #ffffff;
    border: 1px solid #e4dcc8;
    border-radius: 999px;
    padding: 11px 22px;
    font-size: 21px;
    font-weight: 600;
    color: #44525e;
  }
  .domain { margin-left: auto; font-size: 25px; font-weight: 700; color: #a8642f; }
</style>
</head>
<body>

<div class="brand">
  <img src="../public/icon-192.png" alt="" />
  <span>Entrelares</span>
</div>

<div class="mid">
  <h1>Two homes,<br />one childhood.</h1>
  <p class="sub"><b>Whose day is it today?</b> A shared parenting calendar, day swaps approved by both, and a history nobody can erase.</p>
</div>

<div class="art"></div>

<div class="foot">
  <span class="chip">Android &amp; iPhone</span>
  <span class="chip">No ads</span>
  <span class="chip">The essentials are free</span>
  <span class="domain">entrelares.app/en</span>
</div>

</body>
</html>
