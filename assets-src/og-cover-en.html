<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Guarda Compartilhada — English Open Graph cover</title>
<!--
  L-16 — generator for public/og-cover-en.png (the English social-sharing banner).

  NOT served: this file lives in assets-src/, like the lead-magnet PDF generator.
  The PT-BR banner (public/og-cover.png, L-02) carries Portuguese text, so reusing it
  on /en/ would show a Portuguese preview to exactly the reader the English page
  exists for.

  Render it with headless Chrome/Edge at the Open Graph size (1200x630):

    chrome --headless --disable-gpu --hide-scrollbars \
           --screenshot=public/og-cover-en.png --window-size=1200,630 \
           assets-src/og-cover-en.html

  On Windows the binary is usually
  "C:\Program Files\Google\Chrome\Application\chrome.exe" or
  "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe".
  Re-render whenever the English hero copy changes.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: #071233;
    background-image:
      radial-gradient(1100px 620px at 78% 8%, #1e2f6b 0%, rgba(30,47,107,0) 62%),
      radial-gradient(760px 520px at 6% 100%, #3b1740 0%, rgba(59,23,64,0) 58%),
      linear-gradient(160deg, #05102c 0%, #0a1740 55%, #07132f 100%);
    color: #ffffff;
    padding: 62px 70px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand img { width: 62px; height: 62px; border-radius: 16px; display: block; }
  .brand span { font-size: 31px; font-weight: 700; letter-spacing: -0.01em; }

  h1 {
    font-size: 78px; font-weight: 800; line-height: 1.04; letter-spacing: -0.035em;
    margin-bottom: 26px;
  }
  .sub { font-size: 30px; line-height: 1.42; color: #c9d4ec; max-width: 1010px; }
  .sub b { color: #8ea2ff; font-weight: 700; }

  .foot { display: flex; align-items: center; gap: 16px; }
  .chip {
    background: rgba(255, 255, 255, 0.09);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    padding: 11px 22px;
    font-size: 21px;
    font-weight: 600;
    color: #e5ebfa;
  }
  .domain { margin-left: auto; font-size: 25px; font-weight: 600; color: #8ea2ff; }
</style>
</head>
<body>

<div class="brand">
  <img src="../public/icon-192.png" alt="" />
  <span>Guarda Compartilhada</span>
</div>

<div>
  <h1>Whose day is it today?</h1>
  <p class="sub"><b>Never argue about the calendar.</b> Day swaps approved by both parents, and a history nobody can erase.</p>
</div>

<div class="foot">
  <span class="chip">Android &amp; iPhone</span>
  <span class="chip">No app store</span>
  <span class="chip">No ads</span>
  <span class="domain">guardacompartilhada.com/en</span>
</div>

</body>
</html>
