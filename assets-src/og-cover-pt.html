<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Entrelares — Open Graph cover (PT-BR)</title>
<!--
  F-54 — generator for public/og-cover.png (the PT-BR social-sharing banner).

  NOT served: this file lives in assets-src/. The original L-02 banner predated this
  repo's generator convention; the F-54 rebrand recreated it here so the brand swap
  (and any future copy change) is reproducible.

  Render it with headless Chrome/Edge at the Open Graph size (1200x630):

    chrome --headless --disable-gpu --hide-scrollbars \
           --screenshot=public/og-cover.png --window-size=1200,630 \
           assets-src/og-cover-pt.html

  On Windows the binary is usually
  "C:\Program Files\Google\Chrome\Application\chrome.exe" or
  "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe".
  Re-render whenever the PT-BR hero copy changes.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: #071233;
    background-image:
      radial-gradient(1100px 620px at 78% 8%, #1e2f6b 0%, rgba(30,47,107,0) 62%),
      radial-gradient(760px 520px at 6% 100%, #3b1740 0%, rgba(59,23,64,0) 58%),
      linear-gradient(160deg, #05102c 0%, #0a1740 55%, #07132f 100%);
    color: #ffffff;
    padding: 48px 70px 54px;
    position: relative;
  }
  /* Fixed positions, not flex space-between: font metrics differ per platform
     (Segoe UI on Windows, DejaVu on Linux CI) and a metric-dependent layout
     overflowed the 630px canvas when rendered off-Windows. */
  .mid { position: absolute; top: 195px; left: 70px; right: 70px; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand img { width: 62px; height: 62px; border-radius: 16px; display: block; }
  .brand span { font-size: 31px; font-weight: 700; letter-spacing: -0.01em; }

  h1 {
    font-size: 70px; font-weight: 800; line-height: 1.04; letter-spacing: -0.035em;
    margin-bottom: 22px;
  }
  .sub { font-size: 27px; line-height: 1.42; color: #c9d4ec; max-width: 1010px; }
  .sub b { color: #8ea2ff; font-weight: 700; }

  .foot { position: absolute; bottom: 54px; left: 70px; right: 70px;
          display: flex; align-items: center; gap: 16px; }
  .chip {
    background: rgba(255, 255, 255, 0.09);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    padding: 11px 22px;
    font-size: 21px;
    font-weight: 600;
    color: #e5ebfa;
  }
  .domain { margin-left: auto; font-size: 25px; font-weight: 600; color: #8ea2ff; }
</style>
</head>
<body>

<div class="brand">
  <img src="../public/icon-192.png" alt="" />
  <span>Entrelares</span>
</div>

<div class="mid">
  <h1>De quem é o dia hoje?</h1>
  <p class="sub"><b>Nunca mais discuta pelo calendário.</b> Trocas com aprovação dos dois e histórico completo.</p>
</div>

<div class="foot">
  <span class="chip">Android e iPhone</span>
  <span class="chip">Sem loja de apps</span>
  <span class="chip">Sem anúncios</span>
  <span class="domain">entrelares.app</span>
</div>

</body>
</html>
