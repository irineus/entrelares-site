name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    # T-46 (app repo): docs-only pushes skip the deploy — the root *.md files
    # (README/ROADMAP/CLAUDE) are never served (only public/ is). The GitHub
    # evaluation is over the UNION of the push's changed files, so any push
    # touching site content still deploys normally. test.yml is left without
    # this filter ON PURPOSE (PR gate, seconds-fast). workflow_dispatch
    # remains the manual override.
    paths-ignore:
      - '**.md'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # L-34: bake the app's live parameters into the pages (the production
      # project's T-81 feed) — the same rules the Worker applies at serve time.
      # A feed that does not answer never blocks the deploy: the committed
      # values ship and the run summary says so.
      - name: Bake the live parameters
        run: node tool/bake-params.mjs production public

      # L-44: keep the sitemap that is LIVE right now (the previous deploy's), so
      # the IndexNow step below submits only the pages this deploy changed (new
      # <loc> or a moved <lastmod>). A miss leaves no file and the step submits
      # every sitemap URL instead. Never fails the job.
      - name: Keep the live sitemap (IndexNow baseline)
        continue-on-error: true
        run: curl -fsS --max-time 15 https://entrelares.app/sitemap.xml -o "$RUNNER_TEMP/sitemap-live.xml" || echo "::warning::sitemap anterior indisponível — o IndexNow vai enviar todas as URLs"

      - name: Deploy static assets via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The action defaults to Wrangler 3.x, which cannot deploy an
          # assets-only Worker (no `main` entry-point). Assets support needs 4.x.
          wranglerVersion: "4.113.0"

      # L-44: ping IndexNow (Bing, Yandex and the other members; Bing's index also
      # feeds DuckDuckGo — Google does NOT use IndexNow, the sitemap stays its only
      # channel). Production only, AFTER the deploy succeeded, so the key file
      # public/<key>.txt is already served when IndexNow validates it. Best-effort:
      # the script exits 0 on any HTTP or network failure (a ::warning:: with the
      # status) and the step is continue-on-error, so it can never turn a good
      # deploy red. No secret — the IndexNow key is public by design.
      - name: Notify IndexNow of the changed pages
        continue-on-error: true
        run: node tool/indexnow.mjs public/sitemap.xml "$RUNNER_TEMP/sitemap-live.xml"
