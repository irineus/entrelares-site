name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    # T-46 (app repo): docs-only pushes skip the deploy — the root *.md files
    # (README/ROADMAP/CLAUDE) are never served (only public/ is). The GitHub
    # evaluation is over the UNION of the push's changed files, so any push
    # touching site content still deploys normally. test.yml is left without
    # this filter ON PURPOSE (PR gate, seconds-fast). workflow_dispatch
    # remains the manual override.
    paths-ignore:
      - '**.md'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # L-34: bake the app's live parameters into the pages (the production
      # project's T-81 feed) — the same rules the Worker applies at serve time.
      # A feed that does not answer never blocks the deploy: the committed
      # values ship and the run summary says so.
      - name: Bake the live parameters
        run: node tool/bake-params.mjs https://jptqbwfziyzlhlmoekzu.supabase.co/functions/v1/public-settings public

      - name: Deploy static assets via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The action defaults to Wrangler 3.x, which cannot deploy an
          # assets-only Worker (no `main` entry-point). Assets support needs 4.x.
          wranglerVersion: "4.113.0"
