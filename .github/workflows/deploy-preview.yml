name: Deploy Preview to Cloudflare

# Preview environment — mirrors the app's DEV/QA: a stable staging site at
# preview.entrelares.app so landing changes can be reviewed live before
# promoting them to production (main). Deploys the SEPARATE worker
# `entrelares-site-preview` (see wrangler.jsonc env.preview).
on:
  push:
    branches: [preview]
    # T-46 (app repo): docs-only pushes skip the deploy — same rationale and
    # list as deploy.yml (root *.md are never served; only public/ is).
    paths-ignore:
      - '**.md'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: deploy-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The preview carries NO analytics (product decision) and must NEVER be
      # indexed (avoid duplicate content with production). Both are applied to
      # the ephemeral CI checkout only — the source/repo is left untouched, so
      # production keeps its Umami tag and normal robots.txt.
      - name: Strip analytics + block indexing
        run: |
          # Remove the Umami loader from every page; the inert data-umami-event
          # attributes may stay (they do nothing without the loader).
          find public -name '*.html' -print0 | xargs -0 sed -i '/cloud\.umami\.is/d'
          # noindex the whole preview site.
          printf 'User-agent: *\nDisallow: /\n' > public/robots.txt

      # T-79 (app repo, 22/09/2026): the preview's app links go to the QA app,
      # never to production. `qa.entrelares.app` is the app's `main` built
      # against the DEV database, so a landing change is tested end to end —
      # sign-up included — without creating an account in the product. Same
      # shape as the step above: the ephemeral checkout only, so production
      # keeps linking `web.entrelares.app`. Fails when it rewrites NOTHING (the
      # links changed shape and this step went blind) and when anything is
      # LEFT (a preview reader would cross into production unannounced).
      - name: Point the app links at the QA app
        run: |
          set -euo pipefail
          before=$(grep -rho 'https://web\.entrelares\.app' public --include='*.html' | wc -l)
          [ "$before" -gt 0 ] || { echo "::error::no https://web.entrelares.app link found — the rewrite would be blind"; exit 1; }
          find public -name '*.html' -print0 | xargs -0 sed -i 's#https://web\.entrelares\.app#https://qa.entrelares.app#g'
          if grep -rl 'https://web\.entrelares\.app' public; then
            echo "::error::links to the production app survived the rewrite"; exit 1
          fi
          echo "Links do app no preview: $before apontam para https://qa.entrelares.app (banco de QA)." >> "$GITHUB_STEP_SUMMARY"

      # L-34: bake the app's live parameters into the pages (the dev
      # project's T-81 feed) — the same rules the Worker applies at serve time.
      # A feed that does not answer never blocks the deploy: the committed
      # values ship and the run summary says so.
      - name: Bake the live parameters
        run: node tool/bake-params.mjs https://buroanotfjcgvbfmacuh.supabase.co/functions/v1/public-settings public

      - name: Deploy static assets via Wrangler (preview env)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Assets-only Workers need Wrangler 4.x (same pin as production).
          wranglerVersion: "4.113.0"
          command: deploy --env preview
