    <script type="application/ld+json" data-param-jsonld="billing.price_monthly_cents billing.price_annual_cents calendar_months_premium">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Como funciona a guarda dos filhos depois da separação?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cada família chega ao seu próprio arranjo — guarda compartilhada formal, guarda unilateral com convivência, ou um combinado ainda sem homologação. Em todos eles o desafio prático é o mesmo: saber com quem a criança fica em cada dia, como ficam feriados e férias, e o que fazer quando é preciso trocar um dia. É esse combinado do dia a dia que o app Entrelares organiza, qualquer que seja o formato da guarda."
          }
        },
        {
          "@type": "Question",
          "name": "O que é o calendário (ou regime) de convivência?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "É o combinado que define de quem é cada dia: semanas alternadas, dias fixos, fins de semana revezados, feriados. Quando fica só na cabeça de cada um ou espalhado no WhatsApp, vira fonte de atrito. O app coloca esse calendário num único lugar, igual para os dois responsáveis, com cada troca de dia aprovada pelo outro e registrada com data e hora."
          }
        },
        {
          "@type": "Question",
          "name": "O outro responsável precisa ter conta também?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O app funciona melhor com os dois: você cria a família e envia um convite por e-mail. É com as duas contas que as trocas de dia ganham a aprovação mútua. Você pode começar sozinho e convidar o outro responsável quando quiser."
          }
        },
        {
          "@type": "Question",
          "name": "O histórico serve como prova na justiça?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O app registra permanentemente todas as trocas, aprovações e alterações, com data e hora, num histórico que não pode ser editado ou apagado. O relatório em PDF do período (Premium) traz um QR code com o qual quem o recebe confere que o arquivo não foi alterado. Esse registro pode ser útil para documentar o cumprimento do acordo de convivência, mas o valor de qualquer documento como prova é sempre uma decisão do juiz. Na dúvida, converse com seu advogado."
          }
        },
        {
          "@type": "Question",
          "name": "Meus dados e os dos meus filhos estão seguros?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Cada família só enxerga os próprios dados, e a separação é garantida no banco de dados, não apenas na tela. Não exibimos anúncios nem vendemos dados, e seguimos a LGPD."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto custa o app de guarda compartilhada?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O essencial é gratuito: calendário do casal, trocas com aprovação dos dois e histórico. O plano Premium custa R$ 5,49/mês (ou R$ 54,90/ano) por família na versão web — preço promocional de lançamento, válido até 31/12/2026 e só por esse canal, que cobre todos os responsáveis; pelo Google Play, no app Android, custa R$ 5,99/mês ou R$ 59,90/ano — e libera recursos avançados como cuidadores além do casal, a agenda completa da criança, as despesas compartilhadas, escrever na Conversa da família, o relatório em PDF verificável por QR code e planejamento de até 24 meses. Pagamento por Pix (sem informar cartão) ou cartão de crédito, com garantia de reembolso integral em até 7 dias (art. 49 do CDC); cancele quando quiser sem perder dados."
          }
        },
        {
          "@type": "Question",
          "name": "Dá para organizar também a agenda e as despesas dos filhos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. A agenda da criança reúne escola, saúde, remédios e atividades de cada filho, com rotinas que se repetem e lembretes; a nota do dia é gratuita, e o resto da agenda faz parte do Premium. As despesas compartilhadas (Premium) dividem cada gasto em partes iguais, por valor, por porcentagem ou por cotas, mostram o saldo de cada um e o menor número de pagamentos para acertar. Um pagamento só conta quando quem recebe confirma, e o app não movimenta dinheiro."
          }
        },
        {
          "@type": "Question",
          "name": "Avós ou a babá podem só acompanhar, sem mexer em nada?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim, como visualizador: vê o calendário, a agenda e os relatórios e recebe as notificações informativas no app, mas não altera nada, não entra em trocas e não vê as mensagens das trocas nem as despesas. O plano gratuito já inclui visualizador; o Premium permite mais."
          }
        },
        {
          "@type": "Question",
          "name": "Existe uma conversa entre os responsáveis dentro do app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. A Conversa da família é uma só, para todos, e nenhuma mensagem pode ser editada nem apagada; cada uma mostra quem já leu. Escrever faz parte do Premium; sem ele, o que já foi dito continua disponível para leitura. Quem gera o relatório em PDF pode incluir a conversa do período."
          }
        },
        {
          "@type": "Question",
          "name": "Funciona no iPhone e no Android?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. No Android, o app está no Google Play; em qualquer celular com navegador, Android ou iPhone, ele também pode ser instalado direto na tela inicial em segundos."
          }
        },
        {
          "@type": "Question",
          "name": "E se o outro responsável não aprovar uma troca?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A troca simplesmente não acontece: o dia continua valendo como está no calendário, e a recusa fica registrada no histórico. Se ele não responder, passado o prazo o pedido é aprovado automaticamente, e o histórico registra que foi por falta de resposta. Um dia só troca de responsável pelo pedido e pela resposta — e, quando um administrador corrige um dia sozinho, o histórico também diz isso. É isso que mantém o calendário confiável para ambos."
          }
        }
      ]
    }
    </script>
