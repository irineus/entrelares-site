    <script type="application/ld+json" data-param-jsonld="billing.price_monthly_cents billing.price_annual_cents calendar_months_premium">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",

      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does child custody work after a divorce?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every family lands on its own arrangement — formal joint custody, sole custody with visitation, or an agreement that was never taken to court. In all of them the practical challenge is the same: knowing who has the child on each day, how holidays and vacations work, and what to do when a day has to change. That everyday agreement is what the Entrelares app organizes, whatever shape the custody takes."
          }
        },
        {
          "@type": "Question",
          "name": "What is a parenting calendar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It is the agreement that defines whose day each day is: alternating weeks, fixed days, rotating weekends, holidays. When it lives only in each parent's head, or scattered across a chat, it becomes a source of friction. The app puts that calendar in one place, identical for both parents, with every day swap approved by the other parent and recorded with date and time."
          }
        },
        {
          "@type": "Question",
          "name": "Does the other parent need an account too?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The app works best with both: you create the family and send an invitation by e-mail. It is with two accounts that day swaps gain mutual approval. You can start on your own and invite the other parent whenever you want."
          }
        },
        {
          "@type": "Question",
          "name": "Can the history be used as evidence in court?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The app permanently records every swap, approval and change, with date and time, in a history that cannot be edited or deleted. The period's PDF report (Premium) carries a QR code with which whoever receives it checks that the file was not altered. That record can be useful to document how the parenting agreement was followed, but whether any document counts as evidence is always the judge's decision, and the rules differ from country to country. When in doubt, talk to your lawyer."
          }
        },
        {
          "@type": "Question",
          "name": "Are my data and my children's data safe?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Each family sees only its own data, and that separation is enforced in the database, not just on screen. We show no ads and sell no data, and we follow the LGPD, Brazil's data protection law."
          }
        },
        {
          "@type": "Question",
          "name": "How much does the app cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The essentials are free: the calendar for both parents, swaps approved by both, notifications and the history. Premium costs R$ 5,49 per month (or R$ 54,90 per year) per family on the web version — a promotional launch price, valid until December 31, 2026 and on that channel only, that covers every caregiver; on Google Play, in the Android app, it costs R$ 5,99 per month or R$ 59,90 per year — and unlocks advanced features such as caregivers beyond the couple, the child's full agenda, shared expenses, writing in the family chat, the PDF report verifiable by QR code and planning up to 24 months ahead. Prices are charged in Brazilian reais by Pix or credit card, with a full refund within 7 days of payment; cancel whenever you like without losing any data."
          }
        },
        {
          "@type": "Question",
          "name": "Can I also organise the children's agenda and expenses?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The child's agenda gathers school, health, medicines and activities for each child, with routines that repeat and reminders; the day note is free, and the rest of the agenda is part of Premium. Shared expenses (Premium) split each expense equally, by amount, by percentage or by shares, show each person's balance and the fewest payments to settle up. A payment counts only once the person receiving it confirms, and the app never moves money."
          }
        },
        {
          "@type": "Question",
          "name": "Can grandparents or a nanny just follow along, without changing anything?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, as a viewer: they see the calendar, the agenda and the reports and get the informative notifications in the app, but they change nothing, take no part in swaps and see neither the swap messages nor the expenses. The free plan already includes a viewer; Premium allows more."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a conversation between the caregivers inside the app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The family chat is a single one, for everyone, and no message can be edited or deleted; each one shows who has read it. Writing is part of Premium; without it, what was already said stays available to read. Whoever generates the PDF report can include the conversation for the period."
          }
        },
        {
          "@type": "Question",
          "name": "Does it work on iPhone and Android?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. On Android the app is on Google Play; on any phone with a browser, Android or iPhone, it can also be installed straight to the home screen in seconds."
          }
        },
        {
          "@type": "Question",
          "name": "What if the other parent doesn't approve a swap?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The swap simply does not happen: the day stays exactly as the calendar has it, and the refusal is recorded in the history. If they do not answer, the request is approved automatically once the deadline passes, and the history records that it was for lack of an answer. A day changes hands only through the request and the answer — and when an administrator corrects a day alone, the history says that too. That is what keeps the calendar trustworthy for both of them."
          }
        },
        {
          "@type": "Question",
          "name": "Is the app available in English?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The whole app interface is available in English and Portuguese, and you can switch language at any time in your profile. What is never translated is what you write yourself — names, notes and messages stay exactly as you typed them. Prices are charged in Brazilian reais."
          }
        }
      ]
