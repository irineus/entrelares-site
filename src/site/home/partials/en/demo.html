<!-- L-17 — the unchangeable-record promise, SHOWN instead of asserted.
     Sibling of #registro in public/index.html — same markup, English copy and
     the English frames. Two coordinates differ from the PT-BR page on purpose:
     the request card is taller here because "Requested on" wraps to two lines.
     Everything the captions claim is verified in the app: a day with an open
     request is frozen (a database rule) and activity_logs is append-only,
     written by trigger only. -->
<section id="record">
    <div class="wrap">
        <h2>Watch the record being written</h2>
        <p class="section-lead">A sentence cannot prove that a record is unchangeable. These are two real screens of the app following <em>the same request</em> — the swap for 31 Aug — from the approval card to the line nobody can take back.</p>
        <div class="demo" id="demo">
            <div class="phone">
                <div class="phone-screen">
                    <div class="demo-frame is-active">
                        <picture>
                            <source srcset="/img/screenshots/en/troca-aguardando-aprovacao-540.webp 540w, /img/screenshots/en/troca-aguardando-aprovacao-720.webp 720w, /img/screenshots/en/troca-aguardando-aprovacao.webp 1080w" sizes="(max-width: 362px) calc(80vw - 22px), 268px" type="image/webp" />
                            <img src="/img/screenshots/en/troca-aguardando-aprovacao.png" width="1080" height="1920" alt="App screen with the pending swap request for 31 Aug 2026: requested by Marina, proposed caregiver Rafael, requested on 23 Aug 2026 7:59 AM, and the Approve and Reject buttons" loading="lazy" decoding="async" />
                        </picture>
                    </div>
                    <div class="demo-frame">
                        <picture>
                            <source srcset="/img/screenshots/en/historico-auditoria-540.webp 540w, /img/screenshots/en/historico-auditoria-720.webp 720w, /img/screenshots/en/historico-auditoria.webp 1080w" sizes="(max-width: 362px) calc(80vw - 22px), 268px" type="image/webp" />
                            <img src="/img/screenshots/en/historico-auditoria.png" width="1080" height="1920" alt="The app's Reports screen, History tab: the 31 Aug 2026 entry recording that the change came from the swap requested by Marina and approved by Rafael, with its date and time" loading="lazy" decoding="async" />
                        </picture>
                    </div>
                    <div class="demo-ring" style="left: 9.9%; top: 56.3%; width: 80.6%; height: 16.7%;" aria-hidden="true"></div>
                </div>
            </div>
            <ol class="demo-steps">
                <li>
                    <button type="button" data-frame="0" data-hl="9.9,56.3,80.6,16.7" aria-current="true">
                        <span class="demo-n">1</span>
                        <span class="demo-tx"><strong>Marina asks for the swap</strong><span class="demo-d">The request arrives with the day, the caregiver she proposes and the exact time it was made: 23 Aug 2026, 7:59 AM.</span></span>
                        <span class="demo-bar"><i></i></span>
                    </button>
                </li>
                <li>
                    <button type="button" data-frame="0" data-hl="9.8,84.5,39.3,4.9" aria-current="false">
                        <span class="demo-n">2</span>
                        <span class="demo-tx"><strong>Rafael decides</strong><span class="demo-d">Approving or declining is up to him. While the request is open, the day stays frozen exactly as it was.</span></span>
                        <span class="demo-bar"><i></i></span>
                    </button>
                </li>
                <li>
                    <button type="button" data-frame="1" data-hl="9.3,36.4,83.3,22.8" aria-current="false">
                        <span class="demo-n">3</span>
                        <span class="demo-tx"><strong>The swap becomes a record</strong><span class="demo-d">The approval lands in the Adjustment history saying where it came from — <em>swap requested by Marina and approved by Rafael</em> — stamped 28 Aug 2026 6:22 PM. The log only ever grows: nothing there can be edited or deleted.</span></span>
                        <span class="demo-bar"><i></i></span>
                    </button>
                </li>
            </ol>
        </div>
    </div>
</section>
